併之日起六個月內，完成選任人員改選及總幹事 改聘；其任期或聘期至該屆任期屆滿為止。","農會會員每戶以一人為限。","1 凡成年之中華民國國民，設籍農會組織區域內，不合前條規定者，得加入農會為個人贊助會員。 2 凡依法登記之農業合作組織、公司、行號、工廠得加入當地農會為團體贊助會員。 3 個人贊助會員及團體贊助會員，除得當選監事外，無選舉權及其他被選舉權。但其他應享權利與 會員同。","1 各級農會以行政區域為其組織區域，並冠以各該區域之名稱。同一區域內以組織一個農會為原則。 但依事實需要，中央主管機關得命同一直轄市之區農會或縣（市）之鄉、鎮（市） 、區農會合併於 直轄市或縣（市）農會，或若干鄉、鎮（市） 、區農會合併組織一個農會，其名稱由主管機關定之。 2 農會會址，除經核准者外，應設於各級政府及鄉、鎮（市）、區公所所在地。","農會理、監事均為無給職、不得兼任農會聘、雇人員、農事小組組長、副組長，或其他與農會有 競爭性團體或企業之職務，並不得經營與農會有競爭性之營利事業。","1 上級農會以其下級農會為會員。下級農會參加上級農會之代表，由該農會會員（代表）大會選舉， 其名額由主管機關定之。下級農會理事長為其上級農會會員代表大會當然代表。 2 各級農會會員代表中，應有三分之二以上為自耕農、佃農及雇農。 3 會員代表任期為四年，連選得連任。 4 會員代表不得兼任農事小組組長、副組長及農會聘、雇人員。 5 各級農會會員代表，應於選舉前辦理候選人登記；非經登記，不得參加競選。","1 農會分為下列三級： 一、鄉（鎮、市、區）農會。 二、縣（市）農會及直轄市農會。 三、全國農會。 2 本法中華民國一百零一年一月十九日修正之條文施行後，省農會、直轄市農會及縣（市）農會應 依本法規定儘速設立全國農會。省農會應於全國農會設立時，併入全國農會。 3 全國農會未設立前，縣（市）農會之上級農會為省農會。","1 本法第三十三條之基層農會會員，除贊助會員外，人數在二百人以下者，應舉行會員大會；超過 二百人時，由所屬農事小組選任會員代表，舉行會員代表大會。 2 農事小組出席基層農會之會員代表名額，按小組有選舉權之會員數在五十人以下者，選出一人， 超過五十人時，每滿五十人加選一人。 3 前項會員代表名額，最高不得超過四十五人，最低不得少於三十一人。其人數有不足或超過時， 按會員人數比例增減之。但依本法第七條之一第一項第二款規定更名為區農會者，得繼續維持更 名前其會員代表之名額。","1 農會置理、監事，分別組成理事會、監事會。理、監事由會員（代表）選任之，其名額依下列之 規定： 一、鄉、鎮（市）、區農會理事九人。 二、縣（市）農會理事九人至十五人。 三、省（市）農會理事十五人至二十一人。 四、全國農會理事二十一人至二十七人。 五、農會監事名額為其理事名額三分之一。 六、農會置候補理、監事，其名額不得超過所置理、監事名額二分之一。 2 各級農會理、監事，其中應有三分之二以上為自耕農、佃農或雇農。 3 農會理、監事應分別互選一人為理事長與常務監事。但上級農會理、監事，不得兼任下級農會理、 監事。","本法修正施行前，農會已收之股金，一律移充農會事業資金，並准予繼承；其辦法由中央主管機 關定之。","鄉、鎮（市）、區以下按實際需要，劃設農事小組，為農會事業基層推行單位；必要時，並得分班 工作。","1 各級農會為辦理前條事業，經主管機關核准，得組織共同經營機構，聯合經營，並得與個人會員 直接交易。共同經營機構為法人，其組織經營辦法，由中央主管機關定之。 2 農會辦理會員金融事業，應設立信用部，除本法另有規定者外，由中央目的事業主管機關依銀行 法相關規定管理之；農會信用部經報請中央目的事業主管機關之核准，得接受非會員之存款。 3 農會信用部與其分部之設立許可、廢止許可、停辦、復業與整頓、設備與人員設置標準、主任之 專業條件、經營業務之範圍與其限制、內部融資規範、各項風險控制比率及餘裕資金之運用等事 項，由中央目的事業主管機關另定辦法管理之。 4 農會…","本法第三條關於目的事業主管機關對農會之指導監督，應各就其主管業務會同主管機關為之。","1 農會之發起組織，應報經主管機關許可後，方得召開發起人會議，並推定籌備員，組織籌備會。 2 籌備及成立時，均應報請主管機關派員指導監選。","農會經濟事業、金融事業、保險事業及農業推廣事業之會計分別獨立，並應編造年度預決算，報 告會員（代表）大會及報請主管機關備查。","有下列情形之一者，不得為農會會員： 一、受破產之宣告尚未復權者。 二、受監護宣告尚未撤銷者。 三、曾受本法所定除名處分者。","1 候選人犯第四十七條之一第一項或前條第一項之罪者，廢止其候選人資格；已當選者，其當選為 無效。 2 遴選合格之總幹事候聘人犯第四十七條之二第一項或前條第二項之罪者，廢止其候聘資格；已聘 任者，廢止其聘任。 3 曾犯第四十七條之一第一項、第四十七條之二第一項或第四十七條之三之罪者，不得為農會選舉 之候選人或總幹事候聘人員。 4 前三項有第四十六條之一第二項但書之情形者，不在此限。","1 農會依前條第一項規定申請合併前，應共同組織合併籌備委員會，就合併有關事項作成合併計畫 書及契約書，提經理事會審議後，附具經會計師查核簽證，且經監事會監察之資產負債表、事業 損益及經費所入所出計算表、盈虧撥補表、現金流量表及財產目錄，提報會員（代表）大會依第 三十七條規定決議之。 2 前項合併計畫書及契約書，應載明下列事項： 一、合併計畫書：包含合併方式、經濟效益評估、合併後組織區域概況、業務發展計畫、未來三 年財務預測、預期進度及可行性分析。 二、合併契約書： （一）合併前各農會名稱、合併後農會名稱及組織區域。 （二）農會資產及負債之評價。 （三）對…","農會依第十一條之一第一項規定向直轄市或縣（市）主管機關申請合併時，應附具下列書件： 一、合併計畫書及契約書。 二、農會會員（代表）大會會議紀錄。 三、合併之決議內容及相關契約書應載明事項，已依前條第三項及第四項規定公告之證明、通知 文件及異議之處理。 四、會員名冊。 五、經會計師查核簽證之資產負債表、事業損益及經費所入所出計算表、盈虧撥補表、現金流量 表及擬制性合併財務報表。 六、其他經直轄市或縣（市）主管機關規定應提出之書件。","1 本法第三十八條第五款所稱農業金融機關，應就每年度所獲純益提撥一部分充作各級農會輔導及 推廣事業費，指全國農業金庫依農業金融法第二十四條第一項第三款規定提撥之各級農會輔導及 推廣事業費。 2 全國農業金庫應將前項各級農會輔導及推廣事業費，設立專戶儲存。原全國農會專戶之款項應於 中華民國一百十年九月九日前轉入全國農業金庫專戶；全國農會於轉入前已分配或核定之補助計 畫由全國農業金庫繼續執行。其用途如下： 一、各級農會辦理政策性嘉惠農民事業。 二、各級農會發展推廣及輔導事業。 3 全國農業金庫辦理前項各級農會輔導及推廣事業費之分配及管理運用，應組成審議小組…","農會經費如左： 一、入會費：會員於入會時一次繳納之，其標準由會員（代表）大會決議，報請主管機關核定之。 二、常年會費：由會員按年依會員（代表）大會決議，報請主管機關核定之標準繳納之。但下級 農會應以其常年會費收入之百分之二十提繳上級農會。 三、事業資金：限於舉辦各種事業之用，其籌集辦法，應經會員（代表）大會通過，並向主管機 關備案。 四、農業推廣經費募集收入：限專用於農業推廣事業，並向主管機關報備。 五、農業金融機關，應就每年度所獲純益撥出一部分，充作各級農會輔導及推廣事業費，不得少 於百分之十。 六、政府補助費：在中央及地方預算中，應編列農會農業推廣事…","全國或省（市）農會依本法第二十六條第二項規定辦理農會聘任職員統一訓練，應組設聯合訓練 機構為之。","1 農會總幹事以外之聘任職員，由總幹事就農會統一考試合格人員中聘任並指揮、監督。 2 前項聘任職員，應由中央或直轄市主管機關督導省農會或直轄市農會統一考訓之。省農會併入全 國農會後，由中央主管機關督導全國農會統一考訓之。","農會理事、監事有本法第二十一條不得兼任、經營情事者，農會應通知其在三十日內自行選擇； 屆期不作決定時，由該農會報請主管機關依本法第四十六條規定，解除其理事、監事職務。","1 農會各種法定會議，應於開會七日前將召集事由及提議事項通知出席人，並報主管機關備查。但 屬於緊急事項者，得縮短通知日程。 2 農會各種法定會議紀錄，應於會後七日內，報主管機關備查；其屬於本法第三十七條各款之決議， 並應專案報經主管機關核准，始得執行。 3 前二項報請備查及核准事項，均應副知上級農會。","主管機關依本法第四條第一項第二十一款之特准農會辦理事項，應報上級主管機關備查。","農會會員（代表）、理事、監事之行使職權，應限於會議時為之。","1 農會會員（代表） 、理事、監事出席法定會議，每人有一表決權，其決議有違反法令或章程，致損 害農會時，應負賠償責任。但表決時提出異議，經會議紀錄記明者，免其責任。 2 農會會議對重大事件之表決，應以書面記名行之。","1 農會理事長，因故不能執行職務時，應指定理事一人召開理事會議，由理事互推一人代理其職務， 如不為或不能指定或推定者，由主管機關指定之。 2 前項經指定召開會議之理事，或經推定、指定為理事長之代理人，於指定或推定後仍無法召開理 事會議時，主管機關得依本法第四十五條或第四十六條規定辦理。 3 第一項指定召開之理事會議，不為或不能推定理事長之代理人時，自該會議之翌日起至理事長代 理人產生前，依理事選舉當選名次為序，暫行代理理事長職務，並報主管機關備查。 4 常務監事因故不能執行職務時，準用前三項規定辦理。","農會理事會或監事會之決議，由理事長或常務監事分別監督執行之。","1 農事小組置組長、副組長各一人，由會員選任之，任期四年，連選得連任。小組組長出缺時，由 副組長繼任；其任期至原任小組組長任期屆滿為止。 2 農會會員入會滿六個月以上者，得登記為農事小組組長、副組長候選人。但有第十五條之一各款 情形之一者，不得登記；已登記者，應予撤銷或廢止。 3 農事小組組長、副組長，應於選舉前辦理候選人登記，非經登記，不得參加競選。","農會會員入會滿六個月以上者，得登記為會員代表候選人。但有下列情形之一者，不得登記；已 登記者，應予撤銷或廢止： 一、積欠農會財物、會費、事業資金、農業推廣經費；或對農會有保證債務，而逾期尚未清償者。 二、有第十八條各款情形之一者。 三、動員戡亂時期終止後，曾犯內亂、外患罪，經判刑確定者。 四、受宣告強制工作之保安處分或流氓感訓處分之裁判確定，尚未執行、執行未畢或執行完畢未 滿五年者。受其他保安處分之裁判確定，尚未執行或執行未畢者。 五、曾犯刑法或其特別法之貪污罪、組織犯罪防制條例之罪，經判刑確定者。 六、曾犯刑法或其特別法之投票行賄、收賄罪、妨害投票或競…","農會理事會議由理事長召集，監事會議由常務監事召集，並各為會議之主席。其開會次數，於農 會章程中訂之。","農事小組應舉行小組會議，每年至少一次，由組長召集，並為會議之主席。","1 農會置總幹事一人，由理事會就中央或直轄市主管機關遴選之合格人員中聘任之。聘期最長以當 屆理事任期為限；如次屆理事會續聘者，考績甲等得續聘。 2 總幹事之聘任，應於理事會成立後六十日內為之；屆期未能產生時，得由上級農會逕行遴派合格 人員代理。全國或省（市）農會總幹事，得由中央主管機關遴派合格人員代理之，其派代期間至 新任總幹事依法聘任時為止。 3 農會總幹事之聘任，須經全體理事二分之一以上之決議行之；其解聘須經全體理事三分之二以上 之決議行之。","農會會員（代表）大會對左列各款事項，須經全體會員（代表）三分之二以上之出席，及出席人 三分之二以上之決議行之： 一、章程之通過或變更。 二、會員之處分。 三、選任人員之罷免。 四、經費之募集。 五、財產之處分。 六、其他與會員權利、義務有關之重大事項。","農事小組會議，以小組會員及贊助會員為法定出席人。","農會監事會之職權如下： 一、監察理事會執行會員（代表）大會決議案。 二、監察理事會各種會務、業務及財務報告。 三、監察理事會年度決算及會計報告。 四、監察農會財務及財產。 五、監察農會內部稽核及金融檢查報告之缺失改善事項。 六、其他依職權應監察事項。","監事會為監察農會財務，得委託會計師協助查核農會年度財務及會計帳冊。","農會以會員（代表）大會為最高權力機構，會員（代表）大會休會期間，理事會依會員（代表） 大會之決議策劃業務，監事會監察業務及財務。","農會理事會之職權如下： 一、審定會員入會及出會。 二、召集會員（代表）大會，並執行其決議。 三、聘任及解聘總幹事。 四、審查會務、業務實施計畫、預決算及各種章則。 五、提出有關書類送監事會審查。 六、陳報主管機關及上級農會之法定書類。 七、提報會員（代表）大會決議事項。 八、其他依職權應辦事項。","1 凡中華民國國民，合於下列規定者，得登記為農會總幹事候聘人： 一、全國及直轄市農會總幹事應具下列資格之一： （一）大學、獨立學院以上學校畢業或高考及格，並曾任機關、學校或農業、金融機構或農民團 體相當薦任職職務三年以上。 （二）專科以上學校畢業，並曾任機關、學校或農業、金融機構或農民團體相當薦任職職務五年 以上。 （三）高中、高職畢業或普考及格，並曾任機關、學校或農業、金融機構或農民團體相當薦任職 職務七年以上。 二、縣（市）、鄉（鎮、市、區）農會總幹事應具下列資格之一： （一）大學、獨立學院以上學校畢業或高考及格，並曾任機關、學校或農業、金融機構或農…","有下列情形之一者，不得登記為農會總幹事候聘人；已登記者，應予撤銷或廢止；已受聘者，亦 同： 一、無中華民國國籍者。 二、積欠農會財物、會費、事業資金、農業推廣經費；或（自民國九十年一月一日起）在農會或 其他金融機構之借款有一年以上延滯本金返還或利息繳納之紀錄；或對農會有保證債務，經 通知其清償而逾一年未清償者。 三、有第十五條之一第三款至第九款情形之一者。 四、有第十六條第一款或第二款情形之一者。 五、曾於擔任農會選任及聘、僱人員期間，因受刑之宣告確定被解除職務者。 六、曾任法人宣告破產時之負責人，破產終結未滿五年者。","農事小組組長之職責如下： 一、召開小組會議。 二、指導會員異動申報。 三、協助推行農會業務。 四、反映小組會員意見。 五、宣達政令。","各級農會人事管理辦法、財務處理辦法、總幹事遴選辦法、選舉罷免辦法及考核辦法，由中央主 管機關定之；其內容及範圍如下： 一、人事管理辦法：人事評議、編制員額、職等與聘僱資格、薪給、就職、離職、考核獎懲、資 遣、退休、撫卹與服務及其他應遵行事項。 二、財務處理辦法：會計處理、預決算編審、財產管理、財務檢核、會計人員權責及其他應遵行 事項。 三、總幹事遴選辦法：總幹事候聘登記、資格審查、遴選程序、評審項目與計分標準及其他應遵 行事項。 四、選舉罷免辦法：選舉罷免之種類、候選登記、資格審查程序、投開票、選舉結果與罷免成立 要件及其他應遵行事項。 五、考核辦法：考…","1 農會會員（代表）大會，分定期會議與臨時會議二種，由理事長召集之。 2 定期會議，各級農會每年應召集一次。臨時會議，經會員（代表）三分之一以上請求，或理事會 認為必要時召集之。 3 前項請求召開之臨時會議，如理事長不於十日內召開時，原請求人得申請主管機關核准以命令召 集之。 4 基層農會如因會員眾多，致召集會員大會確有困難時，得由農事小組選任代表，召集代表大會， 行使會員大會職權。 5 省農會併入全國農會前，其各種會議之召開依第一項至第三項規定辦理。","農會對外行文，其為召開各種法定會議、總幹事之聘任、解聘及獎懲事項，由理事長簽署；其為 對外行使權益、修改章程、處分財產、辦理改組、改選、補選及法定會議紀錄、會務、事業計畫、 工作報告及預、決算之報備等事項，由理事長簽署，總幹事副署；其依理事會決議執行業務或會 務及其他日常事務，由總幹事簽署；並各依權責負其責任。如理事長或總幹事為當事人時，由總 幹事或理事長單獨簽署。","農會會員有下列情形之一者，不得登記為農會理、監事候選人；已登記者，應予撤銷或廢止，其 已當選者，亦同： 一、積欠農會財物、會費、事業資金、農業推廣經費；或（自民國九十年一月一日起）在農會或 其他金融機構之借款有一年以上延滯本金返還或利息繳納之紀錄；或對農會有保證債務，經 通知其清償而逾一年未清償者。 二、有第十五條之一第二款至第九款情形之一者。 三、曾於擔任農會選任或聘、僱人員期間，因受刑之宣告確定，被解除職務未滿四年者。 四、曾任法人宣告破產時之負責人，破產終結未滿五年者。","1 本法第十二條第三項所稱繼續從事農業工作，係指繼續受僱於自耕農、佃農會員，以人力、畜力 或農用機械操作從事農業生產為業，每年實際受僱從事耕作達六個月以上及耕作農地面積達○． 五公頃以上，持有雇主出具之僱用證明書者。 2 前項僱用證明書，應經農事小組組長或村、里長查證屬實；或經地方法院或民間之公證人公證。","農會之主管機關：在中央為行政院農業委員會；在直轄市為直轄市政府；在縣（市）為縣（市） 政府。但其目的事業應受各該事業之主管機關指導、監督。","1 農會任務如左： 一、保障農民權益、傳播農事法令及調解農事糾紛。 二、協助有關土地農田水利之改良、水土之保持及森林之培養。 三、優良種籽及肥料之推廣。 四、農業生產之指導、示範、優良品種之繁殖及促進農業專業區之經營。 五、農業推廣、訓練及農業生產之獎助事項。 六、農業機械化及增進勞動效率有關事項。 七、輔導及推行共同經營、委託經營、家庭農場發展及代耕業務。 八、農畜產品之運銷、倉儲、加工、製造、輸出入及批發、零售市場之經營。 九、農業生產資材之進出口、加工、製造、配售及會員生活用品之供銷。 十、農業倉庫及會員共同利用事業。 十一、會員金融事業。 十二…","1 中華民國九十九年十二月二十五日縣（市）改制或與其他直轄市、縣（市）合併改制為直轄市前 已設立之鄉、鎮（市） 、區農會、縣（市）農會，應於一百零一年六月二十五日以前依下列方式辦 理： 一、縣（市）改制為直轄市：縣（市）農會及鄉、鎮（市）農會未變更組織區域者，逕行更名為 直轄市農會及區農會。 二、縣（市）與其他直轄市、縣（市）合併改制為直轄市：以下級農會為會員之農會，變更組織 為直轄市農會；基層農會未變更組織區域者，更名為區農會。 2 縣（市）農會未依前項第二款規定辦理者，應由直轄市主管機關命其合併。 3 依第一項規定辦理者，其原任選任人員之任期得繼續至…","農會總幹事秉承理事會決議執行任務，向理事會負責。","農會會員（代表）大會之職權如下： 一、選舉或罷免理事、監事及出席上級農會之會員代表。 二、議決入會費、常年會費及事業資金之金額。 三、議決會務、事業計畫與報告及年度預決算。 四、議決各種章則。 五、議決推廣經費之募集及運用。 六、議決對外借款及放款之最高額。 七、議決農會財產之處分。 八、議決本法第十七條所定會員除名之處分。 九、議決其他有關會員權利義務事項。","1 農會理、監事任期均為四年，連選得連任一次。但連任人數不得超過理、監事名額二分之一。 2 前項理、監事任期屆滿改選完成後，應於七日內將理、監事簡歷冊，連同會員增減名冊報請主管 機關備案。","各級農會章程範例，由中央主管機關定之。","1 本法第十五條第一項所定下級農會參加上級農會應選任會員代表之名額，規定如下： 一、鄉（鎮、市、區）農會參加縣（市）農會之會員代表名額，按會員總數在基本數額二千人以 下者，選出二人，超過二千人時，每滿一千人加選一人。 二、縣（市）農會參加省農會之會員代表名額，按所轄農會之基層會員總數，在基本數額三萬人 以下者，選出二人，超過三萬人時，每滿一萬五千人加選一人。 三、直轄市各區農會參加直轄市農會之會員代表名額，按會員總數在基本數額一千人以下者，選 出二人，超過一千人時，每滿五百人加選一人。 四、縣（市）及直轄市農會參加全國農會之會員代表名額共六十五人，其分配…","1 農會選任及聘、僱人員，因刑事案件被羈押或通緝者，應予停止職權。 2 農會選任及聘、僱人員，受有期徒刑以上刑之判決確定者，應解除其職務。但農會選任及聘、僱 人員受緩刑宣告或經判處六個月以下有期徒刑得易科罰金者，不在此限。 3 本條修正施行前，依修正前之規定而停止職權之農會選任及聘、僱人員，自本條施行之日起，適 用修正後之規定。 4 依第一項規定停止職權之人員，經停止羈押或撤銷通緝者，在其任期屆滿前，得申請恢復其職權。 5 農會選任及聘、僱人員任職期間，喪失其候選或候聘資格者，由主管機關或其上級主管機關予以 解除職務。","農會總幹事之職責如下： 一、執行理事會之決議。 二、聘、僱及解聘、僱所屬員工。 三、指揮監督所屬職員推行會務及業務。 四、訓練、考核、獎懲所屬員工。 五、提報理事會審議之事項。 六、其他依職責應辦事項。","農會為法人。","農會以保障農民權益，提高農民知識技能，促進農業現代化，增加生產收益，改善農民生活，發 展農村經濟為宗旨。","1 農會會員合於左列規定，得登記為農會理事、監事候選人： 一、入會滿二年以上。 二、國民中學以上學校畢業或國民小學畢業並曾任農會理事、監事、會員代表、總幹事、農事小 組組長、副組長一任以上。 三、實際從事農業符合中央主管機關所定之資格。 2 前項第三款農會理事、監事候選人實際從事農業資格之認定、審查程序及其他應遵行事項之辦法， 由中央主管機關定之。","1 農會理、監事之候選人，以其所屬基層農會會員為限；上級農會理、監事之候選人，不限於下級 農會出席之代表。 2 農會理、監事應於選舉前辦理候選人登記，非經登記，不得參加競選。","農會應於成立大會後七日內，將章程、會員（代表）名冊及理、監事簡歷冊，報請主管機關核發 登記證書及圖記。","1 本法第二十五條第二項所稱屆期未能產生，係指未能於理事會成立後六十天內，完成理事會合法 聘任決議、發給聘任通知書及總幹事受聘人報到就職。 2 總幹事之聘任屆期未能產生時，主管機關應重新辦理總幹事候聘人登記公告。 3 總幹事任期屆滿或出缺時，應就農會員工歸級表由副總幹事、主任秘書（秘書） 、會務部門主管之 順序暫行代理，其代理期間，至新任總幹事依法聘任或遴選合格人員依法派代時為止。","1 農會解散時，應由主管機關指派清算人。清算人有代表農會執行清算事務之權。 2 農會受破產宣告時，信用部之存款人就信用部之資產有優先受償權。","農會以每年一月一日起至十二月三十一日止為會計年度。","主管機關依本法所為停止職權或解除職務之處分，自送達相對人起，依送達之內容對其發生效力。","農會理、監事及總幹事如有違反法令、章程，嚴重危害農會之情事，主管機關得報經上級主管機 關之核准，或逕由上級主管機關予以停止職權或解除職務。","農會與理事、監事間之關係，除本法另有規定外，依民法關於委任之規定。","農會選舉或罷免訴訟及總幹事聘、解任程序，除有關假處分之規定外，準用民事訴訟法之規定。","1 農會總幹事執行任務，如有違反法令、章程，致損害農會時，應負賠償責任。 2 農會收受與保管之財物，非因不可抗力致生損害時，總幹事及有關職員負連帶賠償責任。","1 農會選任人員應於任期屆滿三十日前或主管機關指定之日期完成改選。 2 農會選任人員之當選人應於規定之日就職。重行選舉或補選之當選人或因故未能於規定期限內完 成選舉就職者，其任期仍應自規定之日起算。","1 各級農會得視實際需要，報經主管機關核准設立辦事處。 2 前項辦事處執行農會指定任務，其涉及目的事業主管機關者，應依有關規定辦理。 3 本法第六條之一所定鄉（鎮、市、區）農會劃設之農事小組，以每一村里一個小組為限；其會員 人數除贊助會員外，未滿五十人者，得由農會按照會員分布、地理環境及村里區域等情況合併鄰 近之村里設一小組。 4 農事小組劃設後，因會員人數增減，得經會員（代表）大會通過，報請主管機關核定後重新劃設。 但農會改選前六個月內不得為之。","本細則依農會法（以下簡稱本法）第五十條規定訂定之。","農會章程應載明左列事項： 一、名稱。 二、宗旨。 三、區域。 四、會址。 五、任務。 六、組織。 七、會員入會、出會與除名。 八、會員之權利與義務。 九、會員代表及理、監事之名額、權限、任期及其選任與解任。 十、總幹事之遴聘、解聘及其職掌。 十一、會議。 十二、會費。 十三、經費及會計。 十四、修改章程之程序。","合併後農會應承受合併前農會之權利義務；合併前農會會員之會籍，並應改隸於合併後農會。","1 農會二種以上選任人員選舉同時辦理時，申請登記為候選人者，以登記一種為限。同時為二種以 上候選人登記時，其登記無效。 2 經申請登記為候選人者，於登記期間截止後，不得撤回其候選人登記；在登記期間截止前經撤回 登記者，不得再申請同一種候選人登記。","農會之決議，有違反法令、妨害公益或逾越其宗旨、任務時，主管機關得令撤銷其決議。","農會怠忽任務，妨害公益，或逾越其任務範圍時，主管機關得予以警告。","1 具有配偶、二親等以內之血親或一親等姻親關係者，不得同時擔任同一農會之理事長、常務監事 或總幹事。 2 有前項情形者，後當選或聘任者，無效。","1 農會理事、監事出缺，應於出缺日起三十日內由候補理事、監事依次遞補。無候補理事、監事而 仍足出席會議法定人數者，不另辦理選舉。但遞補後理事、監事人數不足出席會議法定人數時， 應於出缺日起六十日內辦理補選。 2 農會理事長、常務監事出缺時，應依前項規定遞補或補選理事、監事後，再互選理事長、常務監 事。","農會選任職員因違背法令、章程，或有其他損害農會權益或信譽行為者，得經會員（代表）大會 決議罷免之。","1 農會會員（代表）大會、理、監事會議，除本法另有規定外，須有各該會議應出席人數二分之一 以上之出席，方得開會，及出席人數二分之一以上之同意，方得決議。 2 前項會議除聘任總幹事外，經二次召集出席人數均未達二分之一以上，第三次召集時，出席人數 已達三分之一以上，即得開會。但應出席人數在三人以下時不適用之。","農會會員有違反本法行為，或不遵守章程或代表大會決議，直接危害農會，情節重大者，應予除 名。","本法第十四條所稱之戶，以戶籍登記者為準。入會會員不限於戶長。","農會理事、監事均應親自出席理事、監事會議，除公假及有正當理由外，不得請假。","1 農會年度決算後，各類事業之盈餘，除提撥各該事業公積外，餘應撥充為農會總盈餘。 2 農會總盈餘，除彌補虧損外，依左列規定分配之︰ 一、法定公積百分之十五。 二、公益金百分之五。 三、農業推廣、訓練及文化、福利事業費，不得少於百分之六十二。 四、各級農會間有關推廣、互助及訓練經費百分之八。 五、理、監事及工作人員酬勞金，不得超過百分之十。 3 前項第一款法定公積，第二款公益金及第四款經費之保管運用辦法，由中央主管機關定之。 4 第一項各類事業盈餘提撥各該事業公積之比率，由中央主管機關會同中央目的事業主管機關定之。","農業推廣經費募集收入，經會員（代表）大會通過其用途後，不得移充其他用途或彌補虧損，並 由上級農會與主管機關監督之。","1 合併後農會於申請對合併前農會所有不動產、應登記之動產、智慧財產權及各項擔保物權之變更、 移轉或讓與等登記時，得憑主管機關許可合併之核准函等相關文件，逕向登記機關辦理登記，免 繳納登記費用及免徵因合併而發生之印花稅及契稅，並依下列各款規定辦理： 一、其移轉之有價證券，免徵證券交易稅。 二、其移轉貨物或勞務，非屬營業稅之課徵範圍。 三、合併前農會所有之土地隨同移轉時，經依土地稅法審核確定其現值後，即予辦理土地所有權 移轉登記，其應繳納之土地增值稅准予記存，由合併後農會於該項土地再移轉時一併繳納之； 其破產或解散時，經記存之土地增值稅，應優先受償。 四、合…","1 以強暴、脅迫或其他非法方法妨害他人競選或使他人放棄競選或妨害他人自由行使選舉權者，處 五年以下有期徒刑，得併科新臺幣十五萬元以下罰金。 2 以強暴、脅迫或其他非法方法妨害總幹事之登記、遴選或聘任者，亦同。 3 前二項未遂犯罰之。","1 農會之選舉有下列行為之一者，處三年以下有期徒刑，得併科新臺幣九萬元以下罰金： 一、有選舉權之人，要求、期約或收受財物或其他不正利益，而許以不行使其選舉權或為一定之 行使。 二、對於有選舉權之人，行求、期約或交付財物或其他不正利益，而約其不行使選舉權或為一定 之行使。 三、對於候選人行求、期約或交付財物或其他不正利益，而約其放棄競選或為一定之競選活動。 四、候選人要求、期約或收受財物或其他不正利益，而許以放棄競選或為一定之競選活動。 2 犯前項之罪者，其供犯罪所用、犯罪預備之物、犯罪所生之物或犯罪所得，不問屬於犯罪行為人 與否，沒收之。","下級主管機關為第四十二條、第四十三條之處分時，應經上級主管機關之核准。","1 農會違反其宗旨或任務，其情節重大者，主管機關得予以解散或廢止其登記。 2 農會經解散或廢止登記後，應即重行組織。","農會經營不善、虧損嚴重或有其他重大事故，主管機關認為必要時，得經中央主管機關之核准， 停止會員代表、理事、監事之職權，並予整理。經整理後，應即令其改選。","主管機關依本法第四十五條為農會整理時，依下列規定辦理： 一、由主管機關指定具有理事、監事候選人資格之會員五人至九人為整理委員，其中一人得為贊 助會員，組織整理委員會，代行會員代表、理事、監事之職權，負責整理。整理委員因故出 缺或不能勝任者，主管機關得廢止其指定，並另行指定之。 二、農會原任理事、監事不得為整理委員。 三、整理委員應互推一人為主任委員，為農會整理期間法定代理人。 四、農會整理期間對外行文，以農會整理委員會主任委員名義行之。 五、農會整理時，應由原任理事長、總幹事辦理移交，並由整理委員會盤點接收。整理委員會得 指定具有總幹事候聘人資格者一人為…","1 農會聘任總幹事，自辦理理事候選人登記之日起，有下列行為之一者，處三年以下有期徒刑，得 併科新臺幣九萬元以下罰金： 一、理事或理事候選人要求、期約或收受財物或其他不正利益，而許以聘任或不聘任。 二、對於理事或理事候選人行求、期約或交付財物或其他不正利益，而約其為聘任或不聘任。 三、對於遴選合格之總幹事候聘人員行求、期約或交付財物或其他不正利益，而約其放棄接受聘 任。 四、遴選合格之總幹事候聘人員要求、期約或收受財物或其他不正利益，而許以放棄接受聘任。 2 預備犯前項之罪者，處一年以下有期徒刑。 3 犯前二項之罪者，其供犯罪所用、犯罪預備之物、犯罪所生之…","農會辦理本法第四條第一項第二十款之農業旅遊及農村休閒事業，得設立農業休閒旅遊部門。","農會對會員之服務，得包括其同戶家屬。","1 農會總幹事應於受聘之日起十日內，檢具有不動產之保證人兩人以上保證書或員工誠實保險，向 農會保證。 2 前項不動產或保險之額度，由中央主管機關定之。","農會總幹事及聘雇人員均為專任，不得兼營工商業或兼任公私團體任何有給職務或各級民意代表。 如有競選公職，一經當選就職，視同辭職，予以解任。","農會辦理本法第四條第一項第八款之農畜產品加工、製造及第九款之農業生產資材加工、製造業 務，得設立各類加工廠或製造廠。","農會辦理本法第四條第一項第八款之倉儲業務、第十款之農業倉庫及會員共同利用事業，得設立 農業倉庫，配置共同利用設備。","農會辦理信用部業務，違反中央目的事業主管機關依本法授權所定命令中有關強制或禁止規定或 應為一定行為而不為者，由中央目的事業主管機關處新臺幣六十萬元以上三百萬元以下罰鍰。","本法施行細則，由中央主管機關定之。","本法第十三條第二項團體贊助會員，以各該團體之法定代理人為代表人。","農會辦理本法第四條第一項第四款至第七款、第十四款及第十六款之農業生產指導、示範、農業 推廣、訓練，推行農業機械化、共同經營、家庭農場發展、代耕業務，社會服務及農村文化、醫 療衛生、福利等事項，得視實際需要組織農事研究班、農業產銷班、四健會、家政改進班及其他 有關組織推行之。","合併後農會應向主管機關申請設立或變更登記；主管機關應同時廢止被合併農會之登記。","本法第十二條第一項所稱實際從事農業，係指以自有人力、畜力或農用機械操作經營農業生產為 主者。其因缺乏勞力委託他人以人力、畜力或農用機械代耕，而自行經營農業生產者，視同實際 從事農業。","1 主管機關為監督農會財務處理及財產管理，得派員檢查農會財務報告及其他有關資料。 2 主管機關為前項檢查時，得視需要聘請會計師、律師或其他專業人員協助辦理。"]}</script><script>
